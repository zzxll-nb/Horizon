name: Refresh Dashboard Data

on:
  schedule:
    # 09:00 / 18:00 America/New_York. Both UTC variants are scheduled;
    # the timezone gate below handles EDT and EST.
    - cron: "0 13,14,22,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-publish
  cancel-in-progress: false

jobs:
  should-run:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.eastern-time.outputs.run }}
      hours: ${{ steps.eastern-time.outputs.hours }}
    steps:
      - id: eastern-time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          local_hour="$(TZ=America/New_York date +%H)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "hours=15" >> "$GITHUB_OUTPUT"
          elif [ "$local_hour" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "hours=15" >> "$GITHUB_OUTPUT"
          elif [ "$local_hour" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "hours=9" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "hours=0" >> "$GITHUB_OUTPUT"
          fi

  refresh-and-deploy:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore the last successful snapshots
        run: |
          git fetch --no-tags origin '+refs/heads/dashboard-data:refs/remotes/origin/dashboard-data' || true
          for snapshot in data/dashboard/latest.json data/dashboard/analysis-cache.json data/dashboard/source-state.json data/market/latest.json; do
            git checkout origin/dashboard-data -- "$snapshot" 2>/dev/null || true
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Horizon
        run: python -m pip install -e .

      - name: Prepare the local Horizon configuration
        run: cp data/config.market-intelligence.json data/config.json

      - name: Refresh incremental news snapshot
        id: news
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WINDOW_HOURS: ${{ needs.should-run.outputs.hours }}
        run: horizon --hours "$WINDOW_HOURS" --skip-daily-summary --log-level WARNING

      - name: Refresh market snapshot
        id: market
        continue-on-error: true
        run: horizon-market

      - name: Persist successful snapshots on the data branch
        env:
          STATE_DIR: ${{ runner.temp }}/dashboard-data
          NEWS_OUTCOME: ${{ steps.news.outcome }}
          MARKET_OUTCOME: ${{ steps.market.outcome }}
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/dashboard-data; then
            git worktree add --detach "$STATE_DIR" origin/dashboard-data
          else
            git worktree add -b dashboard-data "$STATE_DIR"
          fi
          if [ "$NEWS_OUTCOME" = "success" ] && [ -f data/dashboard/latest.json ]; then
            mkdir -p "$STATE_DIR/data/dashboard"
            cp data/dashboard/latest.json "$STATE_DIR/data/dashboard/latest.json"
            git -C "$STATE_DIR" add -f data/dashboard/latest.json
            if [ -f data/dashboard/analysis-cache.json ]; then
              cp data/dashboard/analysis-cache.json "$STATE_DIR/data/dashboard/analysis-cache.json"
              git -C "$STATE_DIR" add -f data/dashboard/analysis-cache.json
            fi
            if [ -f data/dashboard/source-state.json ]; then
              cp data/dashboard/source-state.json "$STATE_DIR/data/dashboard/source-state.json"
              git -C "$STATE_DIR" add -f data/dashboard/source-state.json
            fi
          fi
          if [ "$MARKET_OUTCOME" = "success" ] && [ -f data/market/latest.json ]; then
            mkdir -p "$STATE_DIR/data/market"
            cp data/market/latest.json "$STATE_DIR/data/market/latest.json"
            git -C "$STATE_DIR" add -f data/market/latest.json
          fi
          if ! git -C "$STATE_DIR" diff --cached --quiet; then
            git -C "$STATE_DIR" config user.name "github-actions[bot]"
            git -C "$STATE_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$STATE_DIR" commit -m "chore: refresh dashboard snapshots"
            git -C "$STATE_DIR" push origin HEAD:dashboard-data
          fi
          for snapshot in data/dashboard/latest.json data/dashboard/analysis-cache.json data/dashboard/source-state.json data/market/latest.json; do
            if [ -f "$STATE_DIR/$snapshot" ]; then
              mkdir -p "$(dirname "$snapshot")"
              cp "$STATE_DIR/$snapshot" "$snapshot"
            else
              rm -f "$snapshot"
            fi
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build static Dashboard
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          corepack enable
          pnpm --dir dashboard install --frozen-lockfile
          pnpm --dir dashboard lint
          pnpm --dir dashboard typecheck
          pnpm --dir dashboard build

      - name: Record task outcomes
        run: |
          echo "news refresh: ${{ steps.news.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "market refresh: ${{ steps.market.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "static output: dashboard/out" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/out

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
